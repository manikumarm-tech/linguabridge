services:
  - type: web
    name: easytalk
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && cd ../mobile && npm ci && npx expo export -p web
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
